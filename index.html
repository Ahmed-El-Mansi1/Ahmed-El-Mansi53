<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,"Segoe UI",system-ui,sans-serif;line-height:1.7}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:auto;padding:0 16px}

nav a:hover,nav a.on{background:#ffffff1a;color:#fff}
.cnt{background:var(--gold);color:#000;border-radius:99px;font-size:11px;padding:0 6px;margin-inline-start:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 18px;border:0;border-radius:var(--r);font:700 14px Cairo,sans-serif;background:var(--brand);color:#fff;cursor:pointer}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:var(--bad)}.btn.sm{height:34px;padding:0 12px;font-size:13px}
.hero{background:linear-gradient(180deg,var(--navy),var(--navy2));color:#fff;padding:48px 0}

.hero p{max-width:560px;color:#ffffffbf;margin:8px 0 20px}
.tag{color:var(--cyan);font-weight:700;font-size:14px}
.search{display:flex;gap:8px;max-width:560px}
input,select,textarea{width:100%;height:44px;border:1px solid var(--line);border-radius:var(--r);padding:0 14px;font:inherit;background:var(--card);color:var(--ink)}
textarea{height:80px;padding:10px 14px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 0;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 16px;font:600 14px Cairo,sans-serif;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.cover{aspect-ratio:4/3;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;text-align:center;padding:12px;background:linear-gradient(135deg,var(--c1),var(--c2))}

.meta{color:var(--mut);font-size:13px}

.badge.ok{background:#16a34a1f;color:var(--ok)}.badge.bad{background:#dc26261f;color:var(--bad)}.badge.wn{background:#f5b9421f;color:#b7791f}

section.pg{padding:28px 0}
h2{margin:0 0 16px;font-size:22px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}

/* ---------- Motion ---------- */
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes shift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes toastIn{from{opacity:0;transform:translateY(18px) scale(.95)}to{opacity:1;transform:none}}
.hero{background:linear-gradient(120deg,var(--navy),var(--navy2),#16307a,var(--navy2));background-size:300% 300%;animation:shift 14s ease infinite;position:relative;overflow:hidden}
.hero .wrap{position:relative;z-index:1}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(40px);opacity:.35;pointer-events:none}
.hero::before{width:260px;height:260px;background:var(--brand);top:-80px;inset-inline-end:-60px;animation:floaty 7s ease-in-out infinite}
.hero::after{width:200px;height:200px;background:var(--cyan);bottom:-70px;inset-inline-start:10%;animation:floaty 9s ease-in-out infinite reverse}
#app.anim .hero .wrap>*{animation:up .7s cubic-bezier(.2,.7,.2,1) both}
#app.anim .hero .wrap>*:nth-child(2){animation-delay:.08s}#app.anim .hero .wrap>*:nth-child(3){animation-delay:.16s}#app.anim .hero .wrap>*:nth-child(4){animation-delay:.24s}
#app.anim .card,#app.anim .panel,#app.anim .empty,#app.anim .chips,#app.anim h2{animation:up .55s cubic-bezier(.2,.7,.2,1) both}
.card{transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.card:hover{transform:translateY(-6px);box-shadow:0 16px 32px #0b153033}
.cover{transition:transform .6s cubic-bezier(.2,.7,.2,1)}.card:hover .cover{transform:scale(1.07)}
.btn{transition:transform .15s,filter .2s,box-shadow .2s}.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px #2563ff40}.btn:active{transform:scale(.95)}
.chip{transition:background .2s,color .2s,border-color .2s,transform .15s}.chip:hover{transform:translateY(-1px)}.chip:active{transform:scale(.95)}
nav a{transition:background .2s,color .2s}
.line{transition:background .2s}.panel .line:hover{background:#2563ff0d}
.cnt{display:inline-block;animation:pop .45s}
.badge{transition:transform .2s}.card:hover .badge{transform:scale(1.05)}
.toast{animation:toastIn .4s cubic-bezier(.2,.8,.2,1)}
.ov{animation:fade .2s}.ov img{animation:up .35s cubic-bezier(.2,.7,.2,1)}
.pimg{transition:transform .2s}.pimg:hover{transform:scale(1.08)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}[tabindex="-1"]:focus{outline:none}
.tabs{display:flex!important;flex-wrap:wrap!important;overflow:visible!important;gap:8px}.tabs .chip{flex:1 1 auto;text-align:center;min-height:42px;display:inline-flex;align-items:center;justify-content:center}
.cloud label[for=cp],.cloud #cp,.cloud label[for=np],.cloud #np,.cloud label[for=np2],.cloud #np2,.cloud .panel:has([data-act=bk]){display:none!important}
</style>

function sha256js(str){const b=[...new TextEncoder().encode(str)],l=b.length*8;b.push(128);while(b.length%64!==56)b.push(0);for(let i=7;i>=0;i--)b.push(i>3?0:(l>>>(i*8))&255);
 const K=[],H=[];let n=2,c=0;while(c<64){let p=true;for(let d=2;d*d<=n;d++)if(n%d===0){p=false;break}if(p){if(c<8)H.push(Math.floor((Math.sqrt(n)%1)*2**32));K.push(Math.floor((Math.cbrt(n)%1)*2**32));c++}n++}
 const rr=(x,k)=>(x>>>k)|(x<<(32-k));
 for(let o=0;o<b.length;o+=64){const w=[];for(let i=0;i<16;i++)w[i]=(b[o+i*4]<<24)|(b[o+i*4+1]<<16)|(b[o+i*4+2]<<8)|b[o+i*4+3];
  for(let i=16;i<64;i++){const s0=rr(w[i-15],7)^rr(w[i-15],18)^(w[i-15]>>>3),s1=rr(w[i-2],17)^rr(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
  let[a,bb,cc,d,e,f,g,h]=H;
  for(let i=0;i<64;i++){const S1=rr(e,6)^rr(e,11)^rr(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+w[i])|0,S0=rr(a,2)^rr(a,13)^rr(a,22),mj=(a&bb)^(a&cc)^(bb&cc),t2=(S0+mj)|0;h=g;g=f;f=e;e=(d+t1)|0;d=cc;cc=bb;bb=a;a=(t1+t2)|0}
  [a,bb,cc,d,e,f,g,h].forEach((v,i)=>H[i]=(H[i]+v)|0)}
 return H.map(x=>(x>>>0).toString(16).padStart(8,"0")).join("")}
async function sha(s){try{if(globalThis.crypto?.subtle){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}}catch{}return sha256js(s)}
